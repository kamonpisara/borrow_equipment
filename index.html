<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SciLab Next-Gen · ระบบยืม-คืนอุปกรณ์วิทยาศาสตร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b14;
  --bg-grid: rgba(56, 189, 248, 0.04);
  --surface: rgba(15, 23, 42, 0.72);
  --surface-hover: rgba(30, 41, 59, 0.85);
  --border: rgba(56, 189, 248, 0.18);
  --border-strong: rgba(56, 189, 248, 0.45);
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --cyan: #06b6d4;
  --cyan-glow: rgba(6, 182, 212, 0.35);
  --violet: #8b5cf6;
  --grad: linear-gradient(135deg, #06b6d4 0%, #6366f1 55%, #a855f7 100%);
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.14);
  --warn: #f59e0b;
  --warn-bg: rgba(245, 158, 11, 0.14);
  --bad: #f43f5e;
  --bad-bg: rgba(244, 63, 94, 0.14);
  --shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
  --radius-xl: 22px;
  --radius-lg: 14px;
  --radius-md: 10px;
}

[data-theme="light"] {
  --bg: #f1f5f9;
  --bg-grid: rgba(99, 102, 241, 0.05);
  --surface: rgba(255, 255, 255, 0.86);
  --surface-hover: rgba(255, 255, 255, 0.98);
  --border: rgba(99, 102, 241, 0.16);
  --border-strong: rgba(99, 102, 241, 0.4);
  --tx: #0f172a;
  --mu: #64748b;
  --cyan: #0284c7;
  --cyan-glow: rgba(2, 132, 199, 0.22);
  --shadow: 0 12px 30px -6px rgba(15, 23, 42, 0.08);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px),
    radial-gradient(circle at 15% 10%, rgba(6, 182, 212, 0.12), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12), transparent 40%);
  background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%;
  color: var(--tx);
  font-family: 'Anuphan', 'Space Grotesk', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
  min-height: 100vh;
  transition: background-color 0.3s, color 0.3s;
}

/* Header */
header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.header-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--grad);
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: 0 0 18px var(--cyan-glow);
}
.brand-text b {
  font-family: 'Space Grotesk', 'Anuphan', sans-serif;
  font-size: 17px;
  letter-spacing: 0.3px;
  display: block;
  line-height: 1.1;
}
.brand-text small {
  font-size: 11px;
  color: var(--cyan);
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  background: var(--surface-hover);
  border: 1px solid var(--border);
  color: var(--tx);
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 15px;
  padding: 0;
  box-shadow: none;
}
.icon-btn:hover { border-color: var(--border-strong); transform: none; }

.user-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-hover);
  border: 1px solid var(--border);
  padding: 4px 10px 4px 12px;
  border-radius: 99px;
  font-size: 13px;
}
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 8px var(--ok);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* Main & Section Layout */
main {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 16px;
}
.sec-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 8px 0 14px;
  gap: 10px;
}
.sec-head h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-sub {
  font-size: 12px;
  color: var(--mu);
  margin-top: 2px;
}

/* Glass Panels / Cards */
.card {
  background: var(--surface);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, transform 0.2s, background 0.2s;
}
.card:hover {
  border-color: var(--border-strong);
  background: var(--surface-hover);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

/* Grids & Rows */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sp { justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 600px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-2 { grid-template-columns: 1fr; }
}

/* Stat Boxes */
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--grad);
  opacity: 0.7;
}
.stat-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px;
  font-weight: 700;
  margin-top: 4px;
  line-height: 1.1;
}

/* Form Elements */
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--mu);
  margin: 10px 0 5px;
}
input, select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: rgba(15, 23, 42, 0.35);
  color: var(--tx);
  font: inherit;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
[data-theme="light"] input,
[data-theme="light"] select,
[data-theme="light"] textarea {
  background: rgba(255, 255, 255, 0.9);
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px var(--cyan-glow);
}

/* Buttons */
button {
  font: inherit;
  font-weight: 600;
  font-size: 14px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: var(--grad);
  color: #ffffff;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 4px 16px var(--cyan-glow);
  transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
}
button:hover { transform: translateY(-1px); box-shadow: 0 6px 22px var(--cyan-glow); }
button:active { transform: scale(0.98); }
button.o {
  background: transparent;
  border-color: var(--border-strong);
  color: var(--cyan);
  box-shadow: none;
}
button.o:hover { background: rgba(6, 182, 212, 0.1); }
button.d {
  background: linear-gradient(135deg, #f43f5e, #e11d48);
  box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
}
button.sm { padding: 5px 11px; font-size: 12.5px; border-radius: 8px; }

/* Tags / Badges */
.mu { color: var(--mu); font-size: 13px; }
.code-id {
  font-family: 'Space Grotesk', monospace;
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 6px;
  background: rgba(6, 182, 212, 0.12);
  color: var(--cyan);
  border: 1px solid rgba(6, 182, 212, 0.25);
}
.tag {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.tag.ok { color: var(--ok); background: var(--ok-bg); border-color: rgba(16, 185, 129, 0.3); }
.tag.warn { color: var(--warn); background: var(--warn-bg); border-color: rgba(245, 158, 11, 0.3); }
.tag.bad { color: var(--bad); background: var(--bad-bg); border-color: rgba(244, 63, 94, 0.3); }

/* Filter Chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 10px 0; }
.chip {
  padding: 5px 12px;
  border-radius: 99px;
  font-size: 12.5px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--mu);
  cursor: pointer;
  white-space: nowrap;
  box-shadow: none;
}
.chip.active {
  background: var(--cyan);
  color: #041019;
  border-color: var(--cyan);
  font-weight: 700;
}

/* QR Scanner Box */
#qr {
  width: 100%;
  max-width: 300px;
  margin: 10px auto;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px dashed var(--border-strong);
}

/* Bottom Navigation Dock */
nav {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 600px;
  display: flex;
  gap: 4px;
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-strong);
  border-radius: 99px;
  padding: 6px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  z-index: 50;
}
nav button {
  flex: 1;
  border: 0;
  border-radius: 99px;
  background: transparent;
  color: var(--mu);
  padding: 9px 4px;
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: none;
  flex-direction: column;
  gap: 2px;
}
nav button:hover { transform: none; color: var(--tx); }
nav button.on {
  background: var(--grad);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 4px 14px var(--cyan-glow);
}

/* Toast & Dialog */
#toast {
  position: fixed;
  left: 50%;
  top: 72px;
  transform: translateX(-50%);
  padding: 10px 20px;
  border-radius: 99px;
  background: #0f172a;
  border: 1px solid var(--cyan);
  color: #fff;
  font-size: 13.5px;
  font-weight: 500;
  display: none;
  z-index: 99;
  box-shadow: 0 10px 28px rgba(0,0,0,0.4);
}
#toast.err { border-color: var(--bad); background: #4c0519; }

dialog {
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  background: var(--bg);
  color: var(--tx);
  width: min(92vw, 480px);
  padding: 22px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
}
dialog::backdrop {
  background: rgba(2, 6, 23, 0.75);
  backdrop-filter: blur(6px);
}

ul.item-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
ul.item-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 8px;
  background: rgba(148, 163, 184, 0.06);
  margin-bottom: 6px;
  font-size: 14px;
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">⚛️</div>
      <div class="brand-text">
        <b>SciLab OS</b>
        <small>Smart Equipment Hub</small>
      </div>
    </div>
    <div class="header-controls">
      <button class="icon-btn" onclick="toggleTheme()" title="สลับโหมดสว่าง/มืด" id="themeBtn">☀️</button>
      <div id="who"></div>
    </div>
  </div>
</header>

<main id="v"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbx8DJC4dfjYHkmmBBB5W_LS-DtrxAh76VvDEG788OiZ1fQ9vMjIU9W-qsyTCmRgaJBmeg/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, EQ = [], cart = [], tab = '', scanner = null, LOANS = [], eqCat = 'all';

try { S = JSON.parse(localStorage.getItem('sess')); } catch (e) {}
const isStaff = () => S.role !== 'student';

const ST = {
  borrowed: ['กำลังยืม', ''],
  overdue: ['เลยกำหนด', 'bad'],
  pending: ['รออนุมัติ', 'warn'],
  returned: ['คืนแล้ว', 'ok'],
  rejected: ['ไม่อนุมัติ', 'bad'],
  available: ['พร้อมใช้งาน', 'ok'],
  maintenance: ['ซ่อมบำรุง', 'warn'],
  damaged: ['ชำรุด', 'bad'],
  disposed: ['จำหน่ายออก', 'bad']
};
const CAT_LABEL = { physics: '⚡ ฟิสิกส์', chemistry: '🧪 เคมี', biology: '🧬 ชีววิทยา', earth_space: '🪐 โลกและอวกาศ' };
const tag = s => `<span class="tag ${(ST[s]||[])[1]||''}">${(ST[s]||[s])[0]}</span>`;

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  $('#themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}

async function api(action, data = {}) {
  const r = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({action, token: S && S.token, ...data})
  });
  const j = await r.json();
  if (!j.ok) {
    if (/หมดอายุ/.test(j.error)) logout();
    throw new Error(j.error);
  }
  return j.data;
}

function toast(m, err) {
  const t = $('#toast');
  t.textContent = m;
  t.className = err ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, 1); } };

// ---------- ระบบเข้าสู่ระบบ ----------
function logout() {
  S = null;
  try { localStorage.removeItem('sess'); } catch (e) {}
  stopScan();
  render();
}

function render() {
  $('#who').innerHTML = S
    ? `<div class="user-pill"><span class="pulse-dot"></span><span>${esc(S.name)}</span><button class="o sm" style="border-radius:99px;padding:2px 9px;" onclick="logout()">ออก</button></div>`
    : '';

  if (!S) {
    $('#nav').innerHTML = '';
    $('#v').innerHTML = `
      <div style="max-width:420px;margin:28px auto;">
        <div class="card" style="padding:28px 24px;">
          <div style="text-align:center;margin-bottom:20px;">
            <div style="font-size:42px;margin-bottom:6px;">🔬</div>
            <h2 style="margin:0;font-size:22px;">เข้าสู่ระบบปฏิบัติการ</h2>
            <p class="mu" style="margin:4px 0 0;">ยืนยันตัวตนด้วยรหัสประจำตัวและรหัส PIN</p>
          </div>
          <label>รหัสผู้ใช้ (รหัสนักเรียน / รหัสครู)</label>
          <input id="uid" autocomplete="username" inputmode="text" placeholder="เช่น 65001 หรือ T01">
          <label>รหัส PIN</label>
          <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
          <button style="width:100%;margin-top:20px;padding:12px;" onclick="doLogin()">เข้าสู่ระบบ →</button>
        </div>
      </div>`;
    return;
  }

  const T = S.role === 'student'
    ? [['mine', '📋 ประวัติ'], ['borrow', '🧪 ยืมอุปกรณ์'], ['equip', '🔬 คลังอุปกรณ์']]
    : [['borrow', '🧪 ยืม/จ่าย'], ['ret', '📥 รับคืน'], ['appr', '✅ อนุมัติ'], ['equip', '🔬 คลังอุปกรณ์'], ['dash', '📊 ภาพรวม']]
        .concat(S.role === 'admin' ? [['users', '👤 ผู้ใช้']] : []);

  if (!tab || !T.some(t => t[0] === tab)) tab = T[0][0];
  $('#nav').innerHTML = T.map(t => `<button class="${t[0] === tab ? 'on' : ''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
  run(async () => {
    if (!EQ.length) EQ = await api('listEquipment');
    await VIEWS[tab]();
  })();
}

const go = t => { stopScan(); tab = t; render(); };
const doLogin = run(async () => {
  S = await api('login', {user_id: $('#uid').value, pin: $('#pin').value});
  Object.assign(S, S.user);
  try { localStorage.setItem('sess', JSON.stringify(S)); } catch (e) {}
  EQ = [];
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !S) doLogin(); });

// ---------- ส่วนที่ 1: ยืม / จ่ายอุปกรณ์ ----------
function stopScan() { if (scanner) { scanner.stop().catch(() => {}); scanner = null; } }
const toggleScan = run(async () => {
  if (scanner) return stopScan();
  scanner = new Html5Qrcode('qr');
  await scanner.start({facingMode: 'environment'}, {fps: 10, qrbox: 220}, t => { addItem(t); }, () => {});
});

function addItem(id) {
  id = String(id).trim();
  const e = EQ.find(x => String(x.equipment_id) === id);
  if (!e) return toast('ไม่พบอุปกรณ์รหัส ' + id, 1);
  const c = cart.find(x => x.equipment_id === id);
  if (c) {
    if (e.item_type === 'consumable') c.quantity++;
    else return toast('เพิ่มอุปกรณ์ชิ้นนี้ในรายการแล้ว');
  } else {
    cart.push({equipment_id: id, name: e.name, item_type: e.item_type, quantity: 1});
  }
  drawCart();
  toast('เพิ่ม ' + e.name + ' แล้ว');
}

function drawCart() {
  $('#cartCount').textContent = cart.length;
  $('#cart').innerHTML = cart.length
    ? cart.map((c, i) => `
      <div class="card" style="padding:12px 16px;margin-bottom:8px;">
        <div class="row sp">
          <div>
            <b>${esc(c.name)}</b> <span class="code-id">${esc(c.equipment_id)}</span>
          </div>
          <div class="row">
            ${c.item_type === 'consumable' ? `<input type="number" min="1" value="${c.quantity}" style="width:76px;padding:6px 10px;text-align:center;" onchange="cart[${i}].quantity=+this.value">` : '<span class="mu">1 ชิ้น</span>'}
            <button class="d sm" onclick="cart.splice(${i},1);drawCart()">ลบ</button>
          </div>
        </div>
      </div>`).join('')
    : `<div class="card" style="text-align:center;padding:24px;border-style:dashed;">
        <div class="mu">ยังไม่มีอุปกรณ์ในรายการ — สแกน QR Code หรือเลือกจากรหัสด้านบน</div>
      </div>`;
}

const submitLoan = run(async () => {
  const r = await api('createLoan', {
    borrower_id: $('#bid') ? $('#bid').value : '',
    items: cart,
    due_date: $('#due').value,
    group_name: $('#grp').value,
    subject: $('#sub').value
  });
  toast(r.status === 'pending' ? 'ส่งคำขอเรียบร้อย รอครูอนุมัติ' : 'บันทึกการจ่ายอุปกรณ์สำเร็จ');
  cart = []; EQ = []; stopScan(); render();
});

async function vBorrow() {
  $('#v').innerHTML = `
    <div class="sec-head">
      <div>
        <h2>${isStaff() ? '🧪 จ่ายอุปกรณ์ให้ผู้ยืม' : '🧪 สร้างรายการยืมอุปกรณ์'}</h2>
        <div class="sec-sub">ขั้นตอนที่ 1: เลือกอุปกรณ์ · ขั้นตอนที่ 2: ระบุรายละเอียดการยืม</div>
      </div>
    </div>

    <div class="card">
      <div class="row sp" style="margin-bottom:8px;">
        <b>1. ค้นหาหรือสแกนรหัสอุปกรณ์</b>
        <button class="o sm" onclick="toggleScan()">📷 เปิด/ปิดกล้องสแกน QR</button>
      </div>
      <div id="qr"></div>
      <div class="row" style="margin-top:8px;">
        <input id="eid" style="flex:1;" list="eql" placeholder="พิมพ์รหัสหรือเลือกชื่ออุปกรณ์ที่ว่าง...">
        <button onclick="addItem($('#eid').value);$('#eid').value=''">+ เพิ่มรายการ</button>
      </div>
      <datalist id="eql">${EQ.filter(e => e.status === 'available').map(e => `<option value="${esc(e.equipment_id)}">${esc(e.name)}</option>`).join('')}</datalist>
    </div>

    <div class="sec-head" style="margin-top:18px;">
      <b>2. รายการที่เลือก (<span id="cartCount">0</span>)</b>
    </div>
    <div id="cart"></div>

    <div class="card" style="margin-top:14px;">
      <b>3. ข้อมูลประกอบการยืม</b>
      ${isStaff() ? '<label>รหัสผู้ยืม (นักเรียน / ครู) *</label><input id="bid" placeholder="ระบุรหัสผู้รับอุปกรณ์">' : ''}
      <div class="grid-2">
        <div><label>กำหนดวันส่งคืน (ว่าง = ค่ามาตรฐาน)</label><input id="due" type="date"></div>
        <div><label>รายวิชา / กิจกรรม</label><input id="sub" placeholder="เช่น เคมีเพิ่มเติม ม.5"></div>
      </div>
      <label>ชื่อกลุ่ม / หมายเลขโต๊ะปฏิบัติการ (ถ้ามี)</label>
      <input id="grp" placeholder="เช่น กลุ่มที่ 3">
      <button style="width:100%;margin-top:18px;padding:13px;" onclick="submitLoan()">
        ${isStaff() ? '💾 บันทึกการจ่ายอุปกรณ์' : '🚀 ยืนยันส่งคำขอยืมอุปกรณ์'}
      </button>
    </div>`;
  drawCart();
}

// ---------- ส่วนที่ 2: การ์ดแสดงรายการยืม / รับคืน / อนุมัติ ----------
const loanCard = (l, act = '') => `
  <div class="card">
    <div class="card-header">
      <div>
        <div class="row">
          <span class="code-id">${esc(l.loan_id)}</span>
          <b>${esc(l.borrower_name || l.borrower_id)}</b>
        </div>
        <div class="mu" style="margin-top:4px;">
          ยืม: ${esc(l.borrow_date)} · กำหนดคืน: <b style="color:var(--tx);">${esc(l.due_date)}</b>
          ${l.subject ? ' · วิชา ' + esc(l.subject) : ''}
          ${l.group_name ? ' · กลุ่ม ' + esc(l.group_name) : ''}
        </div>
      </div>
      ${tag(l.overdue ? 'overdue' : l.status)}
    </div>

    <ul class="item-list">
      ${l.items.map(i => `
        <li>
          <span>🔹 <b>${esc(i.name)}</b> <span class="mu">× ${esc(i.quantity)}</span></span>
          <span>
            ${i.returned_at ? '<span class="tag ok">คืนแล้ว</span>' : ''}
            ${act === 'ret' && !i.returned_at ? retCtl(i) : ''}
          </span>
        </li>`).join('')}
    </ul>

    ${act === 'ret' ? `<button style="width:100%;margin-top:10px;" onclick="doReturn('${l.loan_id}')">📥 ยืนยันรับคืนอุปกรณ์</button>` : ''}
    ${act === 'appr' ? `
      <div class="grid-2" style="margin-top:12px;">
        <button onclick="doAppr('${l.loan_id}',true)">✅ อนุมัติคำขอ</button>
        <button class="d" onclick="doAppr('${l.loan_id}',false)">❌ ไม่อนุมัติ</button>
      </div>` : ''}
  </div>`;

const retCtl = i => `
  <div class="row">
    <select id="c_${i.loan_item_id}" style="width:auto;padding:5px 10px;font-size:13px;">
      <option value="good">สภาพดี</option>
      <option value="damaged">ชำรุด</option>
      <option value="lost">สูญหาย</option>
    </select>
    ${i.item_type === 'consumable' ? `<input id="q_${i.loan_item_id}" type="number" min="0" value="0" style="width:74px;padding:5px 8px;font-size:13px;" title="จำนวนที่คืน">` : ''}
  </div>`;

async function vMine() {
  const L = await api('myLoans');
  $('#v').innerHTML = `
    <div class="sec-head">
      <div><h2>📋 ประวัติการยืมของฉัน</h2><div class="sec-sub">ตรวจสอบสถานะคำขอและกำหนดวันส่งคืนอุปกรณ์</div></div>
    </div>` + (L.length ? L.map(l => loanCard(l)).join('') : '<div class="card"><p class="mu" style="text-align:center;">ยังไม่มีประวัติการยืม กดเมนู "ยืมอุปกรณ์" ด้านล่างเพื่อเริ่มต้น</p></div>');
}

async function vRet() {
  LOANS = await api('listLoans', {status: 'active'});
  $('#v').innerHTML = `
    <div class="sec-head">
      <div><h2>📥 รับคืนอุปกรณ์</h2><div class="sec-sub">ตรวจเช็กสภาพอุปกรณ์และบันทึกการรับคืนเข้าคลัง</div></div>
    </div>
    <input id="f" placeholder="🔍 ค้นหารหัสรายการ, รหัสผู้ยืม หรือชื่อผู้ยืม..." oninput="drawRet()" style="margin-bottom:14px;">
    <div id="list"></div>`;
  drawRet();
}

function drawRet() {
  const f = $('#f').value.trim().toLowerCase();
  const L = LOANS.filter(l => !f || (l.borrower_id + l.borrower_name + l.loan_id).toLowerCase().includes(f));
  $('#list').innerHTML = L.length ? L.map(l => loanCard(l, 'ret')).join('') : '<div class="card"><p class="mu" style="text-align:center;">ไม่มีรายการค้างคืนในขณะนี้</p></div>';
}

const doReturn = run(async id => {
  const l = LOANS.find(x => x.loan_id === id);
  const items = l.items.filter(i => !i.returned_at).map(i => ({
    loan_item_id: i.loan_item_id,
    condition_in: $('#c_' + i.loan_item_id).value,
    returned_qty: $('#q_' + i.loan_item_id) ? +$('#q_' + i.loan_item_id).value : undefined
  }));
  await api('returnLoan', {loan_id: id, items});
  toast('บันทึกการรับคืนเรียบร้อย');
  EQ = []; render();
});

async function vAppr() {
  LOANS = await api('listLoans', {status: 'pending'});
  $('#v').innerHTML = `
    <div class="sec-head">
      <div><h2>✅ คำขอรออนุมัติ (${LOANS.length})</h2><div class="sec-sub">พิจารณาอนุมัติการยืมอุปกรณ์ที่มีความเสี่ยงหรือต้องควบคุม</div></div>
    </div>` + (LOANS.length ? LOANS.map(l => loanCard(l, 'appr')).join('') : '<div class="card"><p class="mu" style="text-align:center;">ไม่มีคำขอที่รออนุมัติ</p></div>');
}

const doAppr = run(async (id, ok) => {
  await api('approveLoan', {loan_id: id, approve: ok});
  toast(ok ? 'อนุมัติคำขอแล้ว' : 'ปฏิเสธคำขอแล้ว');
  EQ = []; render();
});

// ---------- ส่วนที่ 3: ทะเบียนคลังอุปกรณ์ ----------
async function vEquip() {
  $('#v').innerHTML = `
    <div class="sec-head">
      <div><h2>🔬 คลังอุปกรณ์วิทยาศาสตร์</h2><div class="sec-sub">ตรวจสอบสถานะคงเหลือและตำแหน่งจัดเก็บ</div></div>
      ${['staff', 'admin'].includes(S.role) ? '<button onclick="editEq()">+ เพิ่มอุปกรณ์</button>' : ''}
    </div>
    <input id="f" placeholder="🔍 ค้นหาชื่ออุปกรณ์, รหัส หรือตำแหน่งจัดเก็บ..." oninput="drawEq()">
    <div class="chips" id="catChips">
      ${[['all','ทั้งหมด'],['physics','⚡ ฟิสิกส์'],['chemistry','🧪 เคมี'],['biology','🧬 ชีววิทยา'],['earth_space','🪐 โลกและอวกาศ']]
        .map(([k, lbl]) => `<button class="chip ${eqCat === k ? 'active' : ''}" onclick="eqCat='${k}';vEquip()">${lbl}</button>`).join('')}
    </div>
    <div id="list"></div>`;
  drawEq();
}

function drawEq() {
  const f = $('#f').value.trim().toLowerCase(), can = ['staff', 'admin'].includes(S.role);
  const L = EQ.filter(e =>
    (eqCat === 'all' || e.category === eqCat) &&
    (!f || (e.name + e.equipment_id + e.location).toLowerCase().includes(f))
  );
  $('#list').innerHTML = L.map(e => `
    <div class="card">
      <div class="row sp" style="margin-bottom:6px;">
        <div class="row">
          <span class="code-id">${esc(e.equipment_id)}</span>
          <b>${esc(e.name)}</b>
        </div>
        ${tag(e.status)}
      </div>
      <div class="row sp">
        <div class="mu">
          ${CAT_LABEL[e.category] || esc(e.category)} · 📍 ${esc(e.location || 'ไม่ระบุที่เก็บ')} ·
          ${e.item_type === 'consumable' ? `คงเหลือ <b>${esc(e.quantity_available)}</b> ${esc(e.unit || '')}` : 'ครุภัณฑ์'}
          ${e.risk_level !== 'low' ? ` · <span class="tag warn">เสี่ยง${e.risk_level === 'high' ? 'สูง' : 'ปานกลาง'}</span>` : ''}
        </div>
        ${can ? `<button class="o sm" onclick="editEq('${esc(e.equipment_id)}')">แก้ไข</button>` : ''}
      </div>
    </div>`).join('') || '<div class="card"><p class="mu" style="text-align:center;">ไม่พบรายการอุปกรณ์ที่ค้นหา</p></div>';
}

function editEq(id) {
  const e = EQ.find(x => x.equipment_id === id) || {item_type: 'durable', status: 'available', risk_level: 'low', category: 'physics'};
  const sel = (k, o) => `<select id="e_${k}">${o.map(([v, t]) => `<option value="${v}" ${e[k] === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  $('#dlg').innerHTML = `
    <h2 style="margin-top:0;">${id ? '✏️ แก้ไขข้อมูลอุปกรณ์' : '➕ เพิ่มอุปกรณ์ใหม่'}</h2>
    <label>ชื่ออุปกรณ์</label><input id="e_name" value="${esc(e.name)}">
    <label>รหัสอุปกรณ์ (เว้นว่าง = ระบบสร้างอัตโนมัติ)</label><input id="e_id" value="${esc(e.equipment_id)}" ${id ? 'disabled' : ''}>
    <div class="grid-2">
      <div><label>หมวดวิชา</label>${sel('category', [['physics','ฟิสิกส์'],['chemistry','เคมี'],['biology','ชีววิทยา'],['earth_space','โลกและอวกาศ']])}</div>
      <div><label>ประเภท</label>${sel('item_type', [['durable','ครุภัณฑ์'],['consumable','วัสดุสิ้นเปลือง']])}</div>
      <div><label>สถานะ</label>${sel('status', [['available','พร้อมใช้งาน'],['maintenance','ซ่อมบำรุง'],['damaged','ชำรุด'],['disposed','จำหน่ายออก']])}</div>
      <div><label>ระดับความเสี่ยง</label>${sel('risk_level', [['low','ต่ำ'],['medium','ปานกลาง'],['high','สูง']])}</div>
      <div><label>จำนวนทั้งหมด (วัสดุ)</label><input id="e_qt" type="number" min="0" value="${esc(e.quantity_total ?? '')}"></div>
      <div><label>คงเหลือ (วัสดุ)</label><input id="e_qa" type="number" min="0" value="${esc(e.quantity_available ?? '')}"></div>
      <div><label>แจ้งเตือนเมื่อเหลือไม่เกิน</label><input id="e_min" type="number" min="0" value="${esc(e.min_stock ?? '')}"></div>
      <div><label>หน่วยนับ</label><input id="e_unit" value="${esc(e.unit)}"></div>
    </div>
    <label>ตำแหน่งจัดเก็บ</label><input id="e_loc" value="${esc(e.location)}">
    <label class="row" style="margin-top:12px;cursor:pointer;color:var(--tx);">
      <input type="checkbox" id="e_ap" style="width:auto;" ${String(e.requires_approval).toUpperCase() === 'TRUE' ? 'checked' : ''}> ต้องได้รับการอนุมัติจากครูก่อนยืม
    </label>
    <div class="grid-2" style="margin-top:18px;">
      <button onclick="saveEq('${esc(id || '')}')">💾 บันทึกข้อมูล</button>
      <button class="o" onclick="$('#dlg').close()">ยกเลิก</button>
    </div>`;
  $('#dlg').showModal();
}

const saveEq = run(async id => {
  const v = k => $('#e_' + k).value;
  await api('saveEquipment', {item: {
    equipment_id: id || $('#e_id').value,
    name: v('name'),
    category: v('category'),
    item_type: v('item_type'),
    status: v('status'),
    risk_level: v('risk_level'),
    quantity_total: v('qt'),
    quantity_available: v('qa'),
    min_stock: v('min'),
    unit: v('unit'),
    location: v('loc'),
    requires_approval: $('#e_ap').checked
  }});
  $('#dlg').close();
  toast('บันทึกข้อมูลอุปกรณ์แล้ว');
  EQ = []; render();
});

// ---------- ส่วนที่ 4: ภาพรวมระบบ & จัดการผู้ใช้ ----------
async function vDash() {
  const d = await api('dashboard'), b = d.equipmentByStatus;
  $('#v').innerHTML = `
    <div class="sec-head">
      <div><h2>📊 แดชบอร์ดภาพรวม</h2><div class="sec-sub">สรุปสถานะคลังอุปกรณ์และการยืม-คืนแบบเรียลไทม์</div></div>
    </div>
    <div class="grid-4" style="margin-bottom:20px;">
      <div class="stat-card"><div class="mu">อุปกรณ์ทั้งหมด</div><div class="stat-num" style="color:var(--cyan);">${d.total}</div></div>
      <div class="stat-card"><div class="mu">กำลังถูกยืม</div><div class="stat-num" style="color:var(--ok);">${d.borrowed}</div></div>
      <div class="stat-card"><div class="mu">รออนุมัติ</div><div class="stat-num" style="color:var(--warn);">${d.pending}</div></div>
      <div class="stat-card"><div class="mu">ชำรุด/ซ่อม</div><div class="stat-num" style="color:var(--bad);">${(b.damaged || 0) + (b.maintenance || 0)}</div></div>
    </div>

    <div class="sec-head"><b>⚠️ รายการเกินกำหนดส่งคืน (${d.overdue.length})</b></div>
    ${d.overdue.map(l => loanCard(l)).join('') || '<div class="card"><p class="mu">ไม่มีรายการค้างคืน</p></div>'}

    <div class="grid-2" style="margin-top:16px;">
      <div>
        <div class="sec-head"><b>📉 วัสดุสิ้นเปลืองใกล้หมด</b></div>
        ${d.lowStock.map(e => `<div class="card" style="padding:12px 16px;"><b>${esc(e.name)}</b><div class="mu">เหลือ ${esc(e.quantity_available)} (เกณฑ์ขั้นต่ำ ${esc(e.min_stock)})</div></div>`).join('') || '<div class="card"><p class="mu">สต็อกอยู่ในเกณฑ์ปกติ</p></div>'}
      </div>
      <div>
        <div class="sec-head"><b>⏳ สารเคมี/วัสดุใกล้หมดอายุ</b></div>
        ${d.expiring.map(e => `<div class="card" style="padding:12px 16px;"><b>${esc(e.name)}</b><div class="mu">หมดอายุ ${esc(e.expiry_date)}</div></div>`).join('') || '<div class="card"><p class="mu">ไม่มีรายการใกล้หมดอายุ</p></div>'}
      </div>
    </div>`;
}

async function vUsers() {
  const U = await api('listUsers');
  $('#v').innerHTML = `
    <div class="sec-head">
      <div><h2>👤 จัดการบัญชีผู้ใช้งาน</h2><div class="sec-sub">เพิ่มหรือแก้ไขสิทธิ์การเข้าถึงระบบ</div></div>
    </div>
    <div class="card">
      <b>เพิ่ม / แก้ไขข้อมูลผู้ใช้</b>
      <div class="grid-2">
        <div><label>รหัสผู้ใช้</label><input id="u_id" placeholder="เช่น 65001"></div>
        <div><label>ชื่อ-นามสกุล</label><input id="u_n" placeholder="ระบุชื่อและนามสกุล"></div>
        <div><label>บทบาท</label>
          <select id="u_r">
            <option value="student">นักเรียน</option>
            <option value="teacher">ครู</option>
            <option value="staff">เจ้าหน้าที่ห้องปฏิบัติการ</option>
            <option value="admin">ผู้ดูแลระบบ</option>
          </select>
        </div>
        <div><label>ห้อง / ชั้นเรียน</label><input id="u_c" placeholder="เช่น ม.5/1"></div>
        <div><label>PIN (ผู้ใช้ใหม่ / ตั้งรหัสใหม่)</label><input id="u_p" inputmode="numeric" placeholder="ตัวเลข 4-6 หลัก"></div>
      </div>
      <button style="width:100%;margin-top:16px;" onclick="saveU()">💾 บันทึกข้อมูลผู้ใช้</button>
    </div>

    <div class="sec-head" style="margin-top:18px;"><b>รายชื่อผู้ใช้ในระบบ (${U.length})</b></div>
    ${U.map(u => `
      <div class="card" style="padding:12px 16px;">
        <div class="row sp">
          <div>
            <b>${esc(u.full_name)}</b> <span class="code-id">${esc(u.user_id)}</span>
            <div class="mu">สิทธิ์: ${esc(u.role)} ${u.class_room ? '· ห้อง ' + esc(u.class_room) : ''}</div>
          </div>
          <button class="o sm" onclick="fillU('${esc(u.user_id)}','${esc(u.full_name)}','${esc(u.role)}','${esc(u.class_room)}')">แก้ไข</button>
        </div>
      </div>`).join('')}`;
}

const fillU = (i, n, r, c) => {
  $('#u_id').value = i;
  $('#u_n').value = n;
  $('#u_r').value = r;
  $('#u_c').value = c;
  scrollTo({top: 0, behavior: 'smooth'});
};

const saveU = run(async () => {
  await api('saveUser', {item: {
    user_id: $('#u_id').value,
    full_name: $('#u_n').value,
    role: $('#u_r').value,
    class_room: $('#u_c').value,
    pin: $('#u_p').value
  }});
  toast('บันทึกข้อมูลผู้ใช้เรียบร้อย');
  render();
});

const VIEWS = {borrow: vBorrow, mine: vMine, ret: vRet, appr: vAppr, equip: vEquip, dash: vDash, users: vUsers};
render();
</script>
</body>
